<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Time Calculator</title>
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="./favicon.png">
<style>
  :root {
    --paper: #f0ede4;
    --ink: #111111;
    --pink: #f70090;
    --line: #111111;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: clamp(12px, 4vw, 48px);
  }
  .sheet {
    width: 100%;
    max-width: 440px;
    border: 3px solid var(--line);
    background: var(--paper);
    box-shadow: 7px 7px 0 var(--ink);
    display: flex;
    flex-direction: column;
  }

  header {
    border-bottom: 3px solid var(--line);
    padding: clamp(12px, 3vw, 18px) clamp(14px, 4vw, 20px);
    flex: 0 0 auto;
  }
  .eyebrow {
    font-family: "Courier New", Courier, monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin: 0 0 4px;
    color: #555;
  }
  h1 {
    font-size: clamp(19px, 5.5vw, 25px);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
    line-height: 1.05;
    text-transform: uppercase;
  }
  h1 span {
    background: var(--pink);
    color: var(--paper);
    padding: 0 6px;
  }

  .inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 3px solid var(--line);
    flex: 0 0 auto;
  }
  .field { padding: clamp(10px, 3vw, 16px); }
  .field + .field { border-left: 3px solid var(--line); }
  label {
    display: block;
    font-family: "Courier New", Courier, monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
    color: #555;
  }
  input[type="number"] {
    width: 100%;
    border: none;
    background: transparent;
    color: var(--ink);
    font-family: "Courier New", Courier, monospace;
    font-size: clamp(18px, 5.5vw, 23px);
    font-weight: 700;
    padding: 0;
  }
  input[type="number"]:focus { outline: none; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  /* secondary, smaller assumptions row */
  .assumptions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 3px solid var(--line);
    background: rgba(0,0,0,0.03);
    flex: 0 0 auto;
  }
  .assumptions .field { padding: 7px clamp(10px, 3vw, 16px); }
  .assumptions label { font-size: 9.5px; margin-bottom: 3px; }
  .assumptions input[type="number"] {
    font-size: clamp(13px, 4vw, 15px);
    font-weight: 700;
    color: #555;
  }

  .result {
    padding: clamp(14px, 4vw, 22px);
    border-bottom: 3px solid var(--line);
    text-align: center;
    flex: 0 0 auto;
  }
  .result-value.primary {
    font-family: Georgia, serif;
    font-weight: 700;
    font-style: italic;
    font-size: clamp(30px, 9vw, 40px);
    color: var(--pink);
    line-height: 1;
    display: block;
  }
  .sub-results {
    margin-top: 8px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
    font-family: "Courier New", Courier, monospace;
    font-size: 11.5px;
    color: #555;
  }
  .sub-results b { color: var(--ink); }
  .sub-results b.pink { color: var(--pink); }

  .history {
    padding: 8px clamp(14px, 4vw, 20px) 10px;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .history-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
    flex: 0 0 auto;
  }
  .kicker-sm {
    font-family: "Courier New", Courier, monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #777;
  }
  .clear-btn {
    font-family: "Courier New", Courier, monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    background: none;
    border: none;
    color: var(--pink);
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
  }

  .history-list {
    list-style: none;
    margin: 0;
    padding: 0;
    font-family: "Courier New", Courier, monospace;
    font-size: 11px;
    overflow-y: auto;
    flex: 1 1 auto;
    min-height: 0;
  }
  .history-list li {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 3px 0;
    border-top: 1px dotted #999;
  }
  .history-list li:first-child { border-top: none; }
  .history-empty {
    font-family: "Courier New", Courier, monospace;
    font-size: 11.5px;
    color: #999;
  }
  .h-time { font-weight: 700; color: var(--pink); }

  @media (max-width: 380px) {
    .inputs, .assumptions { grid-template-columns: 1fr; }
    .field + .field { border-left: none; border-top: 3px solid var(--line); }
  }

  /* target ~70-75% of viewport height on mobile */
  @media (max-width: 640px) {
    body { align-items: center; padding: 12px; }
    .sheet { height: 74vh; max-height: 74vh; }
    .history { max-height: none; }
  }
</style>
</head>
<body>
  <div class="sheet">
    <header>
      <p class="eyebrow">Words · Pages → Time</p>
      <h1>Reading <span>Time</span> Calc</h1>
    </header>

    <div class="inputs">
      <div class="field">
        <label for="words">Words</label>
        <input type="number" id="words" value="10000" min="0" step="1" inputmode="numeric">
      </div>
      <div class="field">
        <label for="pages">Pages</label>
        <input type="number" id="pages" value="36" min="0" step="1" inputmode="numeric">
      </div>
    </div>

    <div class="assumptions">
      <div class="field">
        <label for="wpm">Reading wpm</label>
        <input type="number" id="wpm" value="300" min="1" step="1" inputmode="numeric">
      </div>
      <div class="field">
        <label for="wpp">Words / page</label>
        <input type="number" id="wpp" value="275" min="1" step="1" inputmode="numeric">
      </div>
    </div>

    <div class="result">
      <span class="result-value primary" id="hm">0h 33m</span>
      <div class="sub-results">
        <span><b id="minutes">33.3</b> min</span>
        <span><b id="hours">0.56</b> hrs</span>
        <span><b class="pink" id="pagesOut">36</b> pages</span>
      </div>
    </div>

    <div class="history">
      <div class="history-head">
        <span class="kicker-sm">Last 5</span>
        <button class="clear-btn" id="clearBtn" type="button">clear</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>

  <script>
    const wordsInput = document.getElementById('words');
    const pagesInput = document.getElementById('pages');
    const wpmInput = document.getElementById('wpm');
    const wppInput = document.getElementById('wpp');
    const minutesEl = document.getElementById('minutes');
    const hoursEl = document.getElementById('hours');
    const hmEl = document.getElementById('hm');
    const pagesOutEl = document.getElementById('pagesOut');
    const historyList = document.getElementById('historyList');
    const clearBtn = document.getElementById('clearBtn');

    const STORAGE_KEY = 'reading-time-history';
    const MAX_HISTORY = 5;
    let debounceTimer = null;
    let userInteracted = false; // don't log the default values on page load
    let lastEdited = 'words'; // tracks which field drives the calculation: 'words' or 'pages'

    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveHistory(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch (e) { /* storage unavailable, fail silently */ }
    }

    function renderHistory() {
      const list = loadHistory();
      historyList.innerHTML = '';
      if (list.length === 0) {
        historyList.innerHTML = '<li class="history-empty">No entries yet.</li>';
        return;
      }
      list.forEach(entry => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${entry.words.toLocaleString()}w · ${entry.pages}p @ ${entry.wpm}wpm</span><span class="h-time">${entry.hm}</span>`;
        historyList.appendChild(li);
      });
    }

    function addToHistory(entry) {
      let list = loadHistory();
      if (list[0] && list[0].words === entry.words && list[0].wpm === entry.wpm && list[0].pages === entry.pages) return;
      list.unshift(entry);
      list = list.slice(0, MAX_HISTORY);
      saveHistory(list);
      renderHistory();
    }

    function calculate() {
      const wpm = parseFloat(wpmInput.value) || 1;
      const wpp = parseFloat(wppInput.value) || 1;

      let words, pages;
      if (lastEdited === 'pages') {
        pages = parseFloat(pagesInput.value) || 0;
        words = Math.round(pages * wpp);
        wordsInput.value = words;
      } else {
        words = parseFloat(wordsInput.value) || 0;
        pages = Math.round(words / wpp);
        pagesInput.value = pages;
      }

      const minutes = words / wpm;
      const hours = minutes / 60;
      const h = Math.floor(hours);
      const m = Math.round(minutes - h * 60);
      const hm = `${h}h ${m}m`;

      minutesEl.textContent = minutes.toFixed(1);
      hoursEl.textContent = hours.toFixed(2);
      hmEl.textContent = hm;
      pagesOutEl.textContent = pages.toLocaleString();

      if (!userInteracted) return; // skip logging on initial page render

      clearTimeout(debounceTimer);
      if (words > 0) {
        debounceTimer = setTimeout(() => {
          addToHistory({ words, pages, wpm, hm });
        }, 800);
      }
    }

    function markInteracted(source) {
      userInteracted = true;
      lastEdited = source;
      calculate();
    }

    clearBtn.addEventListener('click', () => {
      saveHistory([]);
      renderHistory();
    });

    wordsInput.addEventListener('input', () => markInteracted('words'));
    pagesInput.addEventListener('input', () => markInteracted('pages'));
    wpmInput.addEventListener('input', () => markInteracted(lastEdited));
    wppInput.addEventListener('input', () => markInteracted(lastEdited));

    renderHistory();
    calculate(); // initial render only, never logged
  </script>
</body>
</html>
